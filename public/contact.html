<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>聯絡我們 · AI個人新聞台</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
        color: #e2e8f0;
        line-height: 1.65;
        padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      .meta { color: #94a3b8; font-size: 0.875rem; margin-bottom: 24px; }
      h2 { font-size: 1.05rem; margin: 24px 0 8px; color: #f8fafc; }
      p, li { color: #cbd5e1; font-size: 0.95rem; }
      ul { padding-left: 1.25rem; }
      .contact-box {
        margin-top: 16px;
        padding: 16px;
        border-radius: 14px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.1);
      }
      a { color: #93c5fd; }
      a.back {
        display: inline-block;
        margin-top: 28px;
        color: #93c5fd;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>聯絡我們</h1>
      <p class="meta">AI個人新聞台 · 最後更新：2026 年 6 月</p>

      <p>
        若您對本服務、隱私權、廣告、內容著作權或 App 上架相關事宜有任何問題，歡迎與我們聯繫。
      </p>

      <div class="contact-box">
        <p style="margin: 0 0 8px;"><strong>電子郵件</strong></p>
        <p style="margin: 0;">
          <a href="mailto:support@personal-news-station.app">support@personal-news-station.app</a>
        </p>
        <p style="margin: 12px 0 0; font-size: 0.875rem; color: #94a3b8;">
          我們會在 3～5 個工作天內回覆（若為 AdSense 或版權申訴，請在信件中附上網址與說明）。
        </p>
      </div>

      <h2>常見問題</h2>
      <ul>
        <li>新聞內容錯誤或連結失效：請提供新聞標題與原文連結</li>
        <li>AI 摘要問題：請說明使用的分鐘數與勾選的新聞</li>
        <li>隱私與資料刪除：可清除瀏覽器本機資料，或來信說明需求</li>
      </ul>

      <a class="back" href="/">← 返回 AI個人新聞台</a>
    </main>
  </body>
</html>
