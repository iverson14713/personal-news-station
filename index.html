<!doctype html>
<html lang="zh-Hant">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="theme-color" content="#020617" />

  <title>AI個人新聞台</title>

  <link rel="icon" type="image/png" href="/icon.png" />

  <link
    rel="apple-touch-icon"
    href="/icon.png"
  />

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3353338675205577"
    crossorigin="anonymous"
  ></script>
  <style>
    html {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: #020617;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background-color: #020617;
    }
    #root {
      min-height: 100%;
      min-height: 100dvh;
      width: 100%;
      background-color: #020617;
    }
    .hide-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .bottom-nav-item:active {
      transform: scale(0.94);
    }
    .bottom-nav-item--active {
      position: relative;
    }
    .home-select-btn:active,
    .home-clear-btn:active {
      transform: scale(0.96);
    }
    .home-select-btn:active {
      background: rgba(37, 99, 235, 0.65);
    }
    .home-clear-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }
    .ai-duration-option:active {
      transform: scale(0.98);
    }
    .ai-expand-toggle:active {
      opacity: 0.75;
    }
    .ai-text-collapsed,
    .ai-text-expanded,
    .ai-highlight-body-collapsed,
    .ai-highlight-body-expanded {
      transition: max-height 0.35s ease, opacity 0.25s ease;
    }
    .ai-highlight-card:active {
      background: rgba(255, 255, 255, 0.09);
    }
    .ai-highlights-panel-collapsed,
    .ai-highlights-panel-expanded {
      transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ai-highlights-section-toggle:active {
      opacity: 0.85;
      transform: scale(0.99);
    }
    .player-waveform-bar {
      display: block;
      width: 4px;
      height: 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.45);
    }
    .player-waveform--active .player-waveform-bar {
      background: linear-gradient(180deg, #818cf8, #22d3ee);
      animation: waveBar 0.85s ease-in-out infinite alternate;
    }
    @keyframes waveBar {
      from { height: 8px; opacity: 0.55; }
      to { height: 28px; opacity: 1; }
    }
    .splash-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(226, 232, 240, 0.55);
      display: inline-block;
      animation: splashDot 0.9s ease-in-out infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: 0.12s; }
    .splash-dot:nth-child(3) { animation-delay: 0.24s; }
    @keyframes splashDot {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
